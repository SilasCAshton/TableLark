services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tablelark
      POSTGRES_PASSWORD: tablelark
      POSTGRES_USER: tablelark
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tablelark -d tablelark"]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - "55432:5432"
    volumes:
      - tablelark-postgres:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro

volumes:
  tablelark-postgres:
